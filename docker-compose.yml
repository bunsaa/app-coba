services:

  # ── PHP Laravel App + Nginx (single container) ────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mutu_app
    restart: unless-stopped
    ports:
      - "2005:80"
    volumes:
      - storage_data:/var/www/storage
      - cache_data:/var/www/bootstrap/cache
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:2005
      DB_CONNECTION: mysql
      DB_HOST: 172.40.1.179
      DB_PORT: 3306
      DB_DATABASE: mutu
      DB_USERNAME: root
      DB_PASSWORD: casaos
      QUEUE_CONNECTION: database
      CACHE_STORE: file
      SESSION_DRIVER: file
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    networks:
      - mutu_network


networks:
  mutu_network:
    driver: bridge

volumes:
  storage_data:
  cache_data:
