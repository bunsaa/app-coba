services:

  # ── PHP Laravel App ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mutu_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - /var/www/vendor
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8080
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-contoh}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      QUEUE_CONNECTION: database
      CACHE_STORE: file
      SESSION_DRIVER: file
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    networks:
      - mutu_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Nginx Web Server ─────────────────────────────────────────
  webserver:
    image: nginx:1.27-alpine
    container_name: mutu_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mutu_network
    depends_on:
      - app

  # ── Queue Worker ──────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mutu_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www
      - /var/www/vendor
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-contoh}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      QUEUE_CONNECTION: database
    networks:
      - mutu_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app

networks:
  mutu_network:
    driver: bridge
