services:

  # ── PHP Laravel App ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mutu_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - public_data:/var/www/public
      - storage_data:/var/www/storage
      - cache_data:/var/www/bootstrap/cache
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8085
      DB_CONNECTION: mysql
      DB_HOST: host.docker.internal
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-contoh}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      QUEUE_CONNECTION: database
      CACHE_STORE: file
      SESSION_DRIVER: file
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    networks:
      - mutu_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Nginx Web Server ─────────────────────────────────────────
  webserver:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: mutu_nginx
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - public_data:/var/www/public
    networks:
      - mutu_network
    depends_on:
      - app


networks:
  mutu_network:
    driver: bridge

volumes:
  public_data:
  storage_data:
  cache_data:
