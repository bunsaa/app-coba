services:

  # ── PHP Laravel App ─────────────────────────────────────────
  app:
    image: piaa05/app-coba:latest
    container_name: mutu_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - public_data:/var/www/public
      - storage_data:/var/www/storage
      - cache_data:/var/www/bootstrap/cache
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8085
      DB_CONNECTION: mysql
      DB_HOST: 172.40.1.179
      DB_PORT: 3306
      DB_DATABASE: tarakan
      DB_USERNAME: root
      DB_PASSWORD: casaos
      QUEUE_CONNECTION: database
      CACHE_STORE: file
      SESSION_DRIVER: file
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    networks:
      - mutu_network

  # ── Nginx Web Server ─────────────────────────────────────────
  webserver:
    image: piaa05/app-coba-nginx:latest
    container_name: mutu_nginx
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - public_data:/var/www/public
    networks:
      - mutu_network
    depends_on:
      - app


networks:
  mutu_network:
    driver: bridge

volumes:
  public_data:
  storage_data:
  cache_data:
